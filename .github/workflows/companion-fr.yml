name: Build PokeMMO Companion FR

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/companion-fr.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code original
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
      - name: Installer Android API 37.0
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
